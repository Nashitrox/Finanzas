<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10131b">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Mis Finanzas">
<title>Mis Finanzas</title>
<style>
:root{color-scheme:dark;--line:#293244;--text:#f3f5fa;--muted:#9aa6ba;--green:#8bd6a5;--blue:#82b8ff;--purple:#c0a2ff;--orange:#ffc27d;--red:#ff8e98}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#182235 0,#0c0f16 48%);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.wrap{max-width:780px;margin:auto;padding:20px 14px 56px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:16px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#8bd6a5,#c0a2ff);display:grid;place-items:center;color:#101722;font-weight:900;font-size:21px}h1{font-size:19px;margin:0;letter-spacing:-.03em}.eyebrow{font-size:11px;letter-spacing:.15em;color:var(--muted);text-transform:uppercase}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}.tab{white-space:nowrap}.tab.active{background:#263449;border-color:#55749e}
.btn{border:1px solid var(--line);background:#ffffff08;color:var(--text);padding:9px 12px;border-radius:11px;font:600 13px inherit;cursor:pointer}.btn:active{transform:scale(.98)}.btn.small{padding:6px 9px;font-size:12px}.btn.primary{background:var(--green);color:#101820;border:0}.btn.danger{color:var(--red)}
.card{background:linear-gradient(160deg,rgba(27,34,48,.98),rgba(19,24,35,.98));border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}.grid .card{margin:0;padding:14px}
.label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}.big{font-size:26px;letter-spacing:-.04em;font-weight:750;margin:2px 0}.sub{font-size:12px;color:var(--muted)}.bar{height:7px;background:#30394a;border-radius:99px;overflow:hidden;margin:8px 0 4px}.fill{height:100%;border-radius:99px}
.list{display:grid;gap:8px;margin-top:10px}.entry{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#0e1420;border:1px solid #273144;border-radius:12px;padding:10px 11px}.entry-main{min-width:0;flex:1}.entry-title{font-weight:650}.entry-meta{font-size:12px;color:var(--muted)}.entry-actions{display:flex;gap:5px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}.empty{font-size:13px;color:var(--muted);padding:10px 0}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;text-transform:capitalize}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.dim{opacity:.55}h3{font-size:15px;margin:0}.warn{color:var(--orange)}.bad{color:var(--red)}.ok{color:var(--green)}
input,textarea,select{font-size:16px!important}
@media(max-width:520px){.entry{align-items:flex-start;flex-direction:column}.entry-actions{justify-content:flex-start}.big{font-size:22px}}
</style>
</head>
<body>
<div class="wrap">
<div class="brand"><div class="logo">$</div><div><div class="eyebrow">Tu plata, en orden</div><h1>Mis Finanzas</h1></div></div>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
<div class="sub" style="text-align:center;margin-top:18px">Tus datos se guardan solo en este dispositivo.</div>
</div>
<script>
const K='finanzas-v1',CATS=['Comida','Transporte','Hogar','Salud','Ocio','Compras','Servicios','Otros'];
let S={gastos:[],presu:{},deudas:[],metas:[],cobros:[],grupos:[],ingresos:[],frec:[],fijos:[]};
try{Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
const $=id=>document.getElementById(id),save=()=>localStorage.setItem(K,JSON.stringify(S));
const $c=n=>(n<0?'-':'')+'$'+Math.round(Math.abs(n)).toLocaleString('es-CL');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const today=()=>{const d=new Date();return ym(d)+'-'+String(d.getDate()).padStart(2,'0')};
const uid=()=>Date.now()+Math.floor(Math.random()*1000);
const mLabel=m=>new Date(m+'-15').toLocaleDateString('es-CL',{month:'long',year:'numeric'});
const shiftM=(m,n)=>{const d=new Date(m+'-15');d.setMonth(d.getMonth()+n);return ym(d)};
const spent=(m,c)=>S.gastos.filter(g=>g.d.startsWith(m)&&(!c||g.c===c)).reduce((a,g)=>a+g.a,0);
const sumBy=(a,f)=>a.reduce((n,x)=>n+f(x),0);
const ask=(m,d)=>{const v=prompt(m,d);return v===null?null:v.trim()};
function askN(m,d,z){const v=ask(m,d);if(v===null)return null;const n=Number(v.replace(/\./g,'').replace(',','.'));if(!Number.isFinite(n)||n<0||(n===0&&!z)){alert('Ingresa un número válido.');return null}return n}
const bar=(p,c)=>`<div class="bar"><div class="fill" style="width:${Math.max(0,Math.min(100,p))}%;background:${c||'var(--green)'}"></div></div>`;
const row=(t,m,b,x)=>`<div class="entry ${x||''}"><div class="entry-main"><div class="entry-title">${esc(t)}</div><div class="entry-meta">${m}</div></div><div class="entry-actions">${b}</div></div>`;
const bt=(l,f,c)=>`<button class="btn small ${c||''}" onclick="${f}">${l}</button>`;
const add=(l,f)=>`<div class="row"><button class="btn primary" onclick="${f}">${l}</button></div>`;
const del=(k,id)=>bt('×',`rm('${k}',${id})`,'danger');
let tab='res',M=ym(new Date());
const TABS=[['res','Resumen'],['ing','Ingresos'],['gas','Gastos'],['pre','Presupuesto'],['deu','Deudas'],['aho','Ahorro'],['cob','Me deben'],['com','Compartidos']];
window.go=t=>{tab=t;render()};window.mv=n=>{M=shiftM(M,n);render()};
window.rm=(k,id)=>{if(!confirm('¿Eliminar?'))return;S[k]=S[k].filter(x=>x.id!==id);save();render()};
const nav=()=>`<div class="nav">${bt('‹','mv(-1)')}<b>${mLabel(M)}</b>${bt('›','mv(1)')}</div>`;
function pickCat(){const v=ask('Categoría (escribe el número):\n'+CATS.map((c,i)=>`${i+1}) ${c}`).join('\n'),'1');return v===null?null:CATS[Number(v)-1]||(alert('Elige un número de la lista.'),null)}

/* Gastos */
function askDate(def){const v=ask('Fecha (AAAA-MM-DD). Escribe "ayer" o "hoy"',def||'hoy');if(v===null)return null;const t=v.toLowerCase();if(t==='hoy'||t==='')return today();if(t==='ayer'){const d=new Date();d.setDate(d.getDate()-1);return ym(d)+'-'+String(d.getDate()).padStart(2,'0')}if(!/^\d{4}-\d{2}-\d{2}$/.test(v)||isNaN(new Date(v+'T12:00:00'))){alert('Fecha inválida. Usa AAAA-MM-DD.');return null}return v}
window.addG=()=>{const a=askN('Monto del gasto');if(a===null)return;const c=pickCat();if(!c)return;const n=ask('Nota (opcional)','')||'';const d=askDate();if(d===null)return;S.gastos.push({id:uid(),a,c,n,d});save();render()};
window.editG=id=>{const g=S.gastos.find(x=>x.id===id),a=askN('Monto',g.a);if(a===null)return;const c=pickCat()||g.c,n=ask('Nota',g.n||'');if(n===null)return;const d=askDate(g.d);if(d===null)return;Object.assign(g,{a,c,n,d});save();render()};
window.addI=()=>{const a=askN('Monto del ingreso');if(a===null)return;const n=ask('Concepto (ej: Sueldo, Venta)','Sueldo');if(n===null)return;const d=askDate();if(d===null)return;S.ingresos.push({id:uid(),a,n,d});save();render()};
window.editI=id=>{const g=S.ingresos.find(x=>x.id===id),a=askN('Monto',g.a);if(a===null)return;const n=ask('Concepto',g.n||'');if(n===null)return;const d=askDate(g.d);if(d===null)return;Object.assign(g,{a,n,d});save();render()};
window.addF=()=>{const a=askN('Monto del gasto frecuente');if(a===null)return;const c=pickCat();if(!c)return;const n=ask('Nombre (ej: Café)','')||'';S.frec.push({id:uid(),a,c,n});save();render()};
window.useF=id=>{const f=S.frec.find(x=>x.id===id);S.gastos.push({id:uid(),a:f.a,c:f.c,n:f.n,d:today()});save();render()};
window.addFx=()=>{const a=askN('Monto del gasto fijo mensual');if(a===null)return;const c=pickCat();if(!c)return;const n=ask('Nombre (ej: Arriendo, Internet)','')||'';const dia=askN('Día del mes en que se paga (1 a 28)','1');if(dia===null||dia>28)return alert('Elige un día entre 1 y 28.');S.fijos.push({id:uid(),a,c,n,dia:Math.floor(dia)});save();applyFijos();render()};
function applyFijos(){const m=ym(new Date()),t=new Date().getDate();let ch=0;S.fijos.forEach(f=>{if(f.ult!==m&&t>=f.dia){S.gastos.push({id:uid(),a:f.a,c:f.c,n:f.n||'Gasto fijo',d:m+'-'+String(f.dia).padStart(2,'0')});f.ult=m;ch=1}});if(ch)save()}
window.waC=id=>{const c=S.cobros.find(x=>x.id===id);window.open('https://wa.me/?text='+encodeURIComponent(`Hola ${c.w}, te recuerdo que quedó pendiente ${$c(c.a-c.p)}${c.c?' por '+c.c:''}. ¡Gracias!`))};
window.shG=id=>{const g=S.grupos.find(x=>x.id===id),s=settle(g),t=`${g.n}\nTotal ${$c(s.t)} · ${$c(s.sh)} c/u\n${s.out.join('\n')||'Todos a mano'}`;if(navigator.share)navigator.share({text:t}).catch(()=>{});else{navigator.clipboard&&navigator.clipboard.writeText(t);alert('Resumen copiado.')}};
window.csv=async()=>{const q=s=>'"'+String(s||'').replace(/"/g,'""')+'"',r=['Tipo,Fecha,Categoria,Monto,Nota'].concat(S.ingresos.map(i=>['Ingreso',i.d,'',i.a,q(i.n)].join(',')),S.gastos.map(g=>['Gasto',g.d,g.c,g.a,q(g.n)].join(','))),txt='\ufeff'+r.join('\n'),name='finanzas-'+today()+'.csv';try{const f=new File([txt],name,{type:'text/csv'});if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}}catch(e){if(e.name!=='AbortError')alert('No se pudo exportar.')}};
/* Presupuesto */
window.setLim=i=>{const c=CATS[i],a=askN('Límite mensual para '+c,S.presu[c]||'');if(a===null)return;S.presu[c]=a;save();render()};
window.noLim=i=>{delete S.presu[CATS[i]];save();render()};
/* Deudas */
window.addD=()=>{const n=ask('¿A quién o qué debes? (ej: Tarjeta, Notebook)');if(!n)return;const v=askN('Valor de cada cuota');if(v===null)return;const t=askN('Número total de cuotas');if(t===null)return;const p=askN('Cuotas ya pagadas','0',1);if(p===null)return;const d=askN('Día del mes en que vence (0 si no aplica)','0',1);if(d===null)return;S.deudas.push({id:uid(),n,v,t,p:Math.min(p,t),dia:d});save();render()};
window.payD=id=>{const x=S.deudas.find(y=>y.id===id);if(x.p>=x.t)return;x.p++;S.gastos.push({id:uid(),a:x.v,c:'Servicios',n:'Cuota: '+x.n,d:today()});save();render();if(x.p===x.t)alert('¡Terminaste de pagar '+x.n+'!')};
/* Ahorro */
window.addM=()=>{const n=ask('Nombre de la meta (ej: Viaje)');if(!n)return;const o=askN('¿Cuánto quieres juntar?');if(o===null)return;const a=askN('¿Cuánto llevas ahorrado?','0',1);if(a===null)return;const mo=askN('¿En cuántos meses quieres lograrlo? (0 si no hay plazo)','0',1);if(mo===null)return;const fd=new Date();fd.setMonth(fd.getMonth()+mo);S.metas.push({id:uid(),n,o,a,f:mo?ym(fd)+'-'+String(fd.getDate()).padStart(2,'0'):''});save();render()};
window.aboM=id=>{const a=askN('¿Cuánto abonas?');if(a===null)return;S.metas.find(x=>x.id===id).a+=a;save();render()};
/* Me deben */
window.addC=()=>{const w=ask('¿Quién te debe?');if(!w)return;const a=askN('Monto');if(a===null)return;const c=ask('Concepto (opcional)','')||'';S.cobros.push({id:uid(),w,c,a,p:0,d:today()});save();render()};
window.aboC=id=>{const x=S.cobros.find(y=>y.id===id),a=askN('Abono recibido (resta '+$c(x.a-x.p)+')');if(a===null)return;x.p=Math.min(x.a,x.p+a);save();render()};
window.paidC=id=>{const x=S.cobros.find(y=>y.id===id);x.p=x.a;save();render()};
/* Compartidos */
window.addGr=()=>{const n=ask('Nombre del grupo (ej: Viaje a Pucón)');if(!n)return;const p=(ask('Personas separadas por coma (incluyéndote)','Yo, ')||'').split(',').map(x=>x.trim()).filter(Boolean);if(new Set(p).size<2)return alert('Necesitas al menos 2 personas distintas.');S.grupos.push({id:uid(),n,people:[...new Set(p)],exp:[]});save();render()};
window.addGE=id=>{const g=S.grupos.find(x=>x.id===id),w=ask('¿Qué se pagó?');if(!w)return;const a=askN('Monto');if(a===null)return;const v=ask('¿Quién pagó? (número)\n'+g.people.map((p,i)=>`${i+1}) ${p}`).join('\n'),'1');const p=g.people[Number(v)-1];if(!p)return alert('Elige un número de la lista.');g.exp.push({id:uid(),w,a,p});save();render()};
window.rmGE=(gid,id)=>{const g=S.grupos.find(x=>x.id===gid);g.exp=g.exp.filter(x=>x.id!==id);save();render()};
function settle(g){const t=sumBy(g.exp,e=>e.a),sh=t/g.people.length,cr=[],de=[];g.people.forEach((p,i)=>{const b=sumBy(g.exp.filter(e=>e.p===p),e=>e.a)-sh;if(b>1)cr.push([p,b]);else if(b<-1)de.push([p,-b])});const out=[];let i=0,j=0;while(i<de.length&&j<cr.length){const x=Math.min(de[i][1],cr[j][1]);out.push(`${de[i][0]} le debe ${$c(x)} a ${cr[j][0]}`);de[i][1]-=x;cr[j][1]-=x;if(de[i][1]<1)i++;if(cr[j][1]<1)j++}return{t,sh,out}}
/* Respaldo */
window.exp=async()=>{const txt=JSON.stringify({app:'mis-finanzas',S}),name='mis-finanzas-'+today()+'.json';try{const f=new File([txt],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}}catch(e){if(e.name!=='AbortError')alert('No se pudo exportar.')}};
window.imp=f=>{if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(o.app!=='mis-finanzas'||!o.S)throw 0;if(!confirm('Esto reemplaza todos tus datos actuales. ¿Continuar?'))return;localStorage.setItem(K,JSON.stringify(o.S));location.reload()}catch(e){alert('Archivo de respaldo inválido.')}};r.readAsText(f)};

const incM=m=>sumBy(S.ingresos.filter(i=>i.d.startsWith(m)),i=>i.a);
function cmpTxt(t){const p=spent(shiftM(M,-1)),o=[],n=new Date();if(p)o.push(`${t>=p?'+':''}${Math.round((t-p)/p*100)}% vs mes anterior (${$c(p)})`);if(M===ym(n)&&t){const d=n.getDate(),dm=new Date(n.getFullYear(),n.getMonth()+1,0).getDate();o.push(`Promedio diario ${$c(t/d)} · proyección a fin de mes ${$c(t/d*dm)}`)}const inc=incM(M);if(inc)o.push(`Ingresos ${$c(inc)} · balance ${$c(inc-t)}`);return o.join('<br>')}
function mTxt(x){const ml=Math.max(1,Math.ceil((new Date(x.f+'T12:00:00')-new Date())/(30.44*864e5)));return `ahorra ${$c((x.o-x.a)/ml)}/mes hasta ${x.f.slice(8)}/${x.f.slice(5,7)}/${x.f.slice(0,4)}`}
const quick=()=>`<div class="card"><h3>Gastos frecuentes</h3><div class="sub">Toca uno para registrarlo hoy.</div><div class="row">${S.frec.map(f=>`<span style="display:inline-flex;gap:2px"><button class="btn small" onclick="useF(${f.id})">${esc(f.n||f.c)} ${$c(f.a)}</button>${del('frec',f.id)}</span>`).join('')}${bt('+ Nuevo','addF()')}</div><h3 style="margin-top:14px">Fijos mensuales</h3><div class="sub">Se anotan solos el día elegido de cada mes.</div><div class="list">${S.fijos.map(f=>row((f.n||f.c)+' · '+$c(f.a),'Día '+f.dia+' · '+f.c,del('fijos',f.id))).join('')}</div><div class="row">${bt('+ Nuevo fijo','addFx()')}</div></div>`;
const V={
res(){const m=ym(new Date()),sp=spent(m),inc=incM(m),lim=sumBy(Object.values(S.presu),x=>x),deb=sumBy(S.deudas,d=>(d.t-d.p)*d.v),owed=sumBy(S.cobros,c=>c.a-c.p),sv=sumBy(S.metas,x=>x.a),dd=new Date().getDate();
 const al=[];CATS.forEach(c=>{const l=S.presu[c],s=spent(m,c);if(l&&s>l)al.push(`<span class="bad">${c}: te pasaste por ${$c(s-l)}</span>`);else if(l&&s>l*.85)al.push(`<span class="warn">${c}: llevas ${Math.round(s/l*100)}% del límite</span>`)});
 S.deudas.forEach(d=>{const x=d.dia-dd;if(d.p<d.t&&d.dia&&x>=0&&x<=5)al.push(`<span class="warn">${esc(d.n)}: cuota ${x===0?'vence hoy':'en '+x+' día'+(x>1?'s':'')} (${$c(d.v)})</span>`)});
 return `<div class="grid"><div class="card"><div class="label">Ingresos del mes</div><div class="big ok">${$c(inc)}</div><div class="sub">Balance: <b class="${inc-sp>=0?'ok':'bad'}">${$c(inc-sp)}</b></div></div><div class="card"><div class="label">Gastado en ${mLabel(m).split(' ')[0]}</div><div class="big">${$c(sp)}</div><div class="sub">${lim?'de '+$c(lim)+' presupuestado':'Sin presupuesto definido'}</div></div><div class="card"><div class="label">Por pagar en cuotas</div><div class="big">${$c(deb)}</div><div class="sub">${S.deudas.filter(d=>d.p<d.t).length} deudas activas</div></div><div class="card"><div class="label">Me deben</div><div class="big">${$c(owed)}</div><div class="sub">${S.cobros.filter(c=>c.p<c.a).length} pendientes</div></div><div class="card"><div class="label">Ahorrado</div><div class="big">${$c(sv)}</div><div class="sub">${S.metas.length} metas</div></div></div>
 <div class="card"><h3>Avisos</h3><div class="list">${al.length?al.map(a=>`<div class="entry">${a}</div>`).join(''):'<div class="empty">Todo en orden por ahora.</div>'}</div></div>
 <div class="card"><h3>Respaldo</h3><div class="sub" style="margin-top:4px">Guarda tus datos en un archivo o restáuralos desde uno (reemplaza lo actual).</div><div class="row"><button class="btn" onclick="exp()">Exportar</button><button class="btn" onclick="csv()">Exportar CSV</button><button class="btn" onclick="$('imf').click()">Importar</button><input type="file" id="imf" accept=".json" hidden onchange="imp(this.files[0])"></div></div>`},
ing(){const l=S.ingresos.filter(i=>i.d.startsWith(M)).sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id),t=incM(M),g=spent(M);return nav()+`<div class="card"><div class="label">Ingresos del mes</div><div class="big ok">${$c(t)}</div><div class="sub">Gastos ${$c(g)} · balance <b class="${t-g>=0?'ok':'bad'}">${$c(t-g)}</b>${t?` · ahorraste el ${Math.round((t-g)/t*100)}%`:''}</div>${add('+ Agregar ingreso','addI()')}</div><div class="list">${l.length?l.map(i=>row($c(i.a)+' · '+(i.n||'Ingreso'),i.d.slice(8)+'/'+i.d.slice(5,7),bt('✎',`editI(${i.id})`)+del('ingresos',i.id))).join(''):'<div class="empty">No hay ingresos este mes.</div>'}</div>`},
gas(){const gs=S.gastos.filter(g=>g.d.startsWith(M)).sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id),t=spent(M);
 return nav()+`<div class="card"><div class="label">Total del mes</div><div class="big">${$c(t)}</div><div class="sub">${cmpTxt(t)}</div>${CATS.filter(c=>spent(M,c)).map(c=>`<div style="margin-top:8px"><div class="sub" style="display:flex;justify-content:space-between"><span>${c}</span><span>${$c(spent(M,c))} · ${Math.round(spent(M,c)/t*100)}%</span></div>${bar(spent(M,c)/t*100,'var(--blue)')}</div>`).join('')}${add('+ Agregar gasto','addG()')}</div>${quick()}
 <div class="list">${gs.length?gs.map(g=>row($c(g.a)+' · '+g.c,esc(g.n||'Sin nota')+' · '+g.d.slice(8)+'/'+g.d.slice(5,7),bt('✎',`editG(${g.id})`)+del('gastos',g.id))).join(''):'<div class="empty">No hay gastos este mes.</div>'}</div>`},
pre(){const lt=sumBy(Object.values(S.presu),x=>x),st=sumBy(CATS.filter(c=>S.presu[c]),c=>spent(M,c));
 return nav()+`<div class="card"><div class="label">Presupuesto total</div><div class="big">${lt?$c(lt):'—'}</div><div class="sub">${lt?`Gastado en categorías con límite: ${$c(st)} · ${lt-st>=0?'quedan '+$c(lt-st):'excedido por '+$c(st-lt)}`:'Fija un límite por categoría.'}</div></div><div class="list">${CATS.map((c,i)=>{const l=S.presu[c],s=spent(M,c);return `<div class="entry" style="display:block"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><div><div class="entry-title">${c}</div><div class="entry-meta">${l?`${$c(s)} de ${$c(l)} · ${l>=s?'quedan '+$c(l-s):'excedido '+$c(s-l)}`:`${$c(s)} gastado · sin límite`}</div></div><div class="entry-actions">${bt(l?'Editar':'Fijar límite',`setLim(${i})`)}${l?bt('×',`noLim(${i})`,'danger'):''}</div></div>${l?bar(s/l*100,s>l?'var(--red)':s>l*.85?'var(--orange)':'var(--green)'):''}</div>`}).join('')}</div>`},
deu(){return `<div class="card"><div class="label">Resta por pagar</div><div class="big">${$c(sumBy(S.deudas,d=>(d.t-d.p)*d.v))}</div><div class="sub">Al pagar una cuota se anota también como gasto.</div>${add('+ Agregar deuda o cuotas','addD()')}</div><div class="list">${S.deudas.length?S.deudas.map(d=>`<div class="entry" style="display:block"><div style="display:flex;justify-content:space-between;gap:8px"><div><div class="entry-title">${esc(d.n)}</div><div class="entry-meta">${d.p}/${d.t} cuotas · ${$c(d.v)} c/u · resta ${$c((d.t-d.p)*d.v)}${d.dia?' · vence día '+d.dia:''}</div></div><div class="entry-actions">${d.p<d.t?bt('Pagar cuota',`payD(${d.id})`,'primary'):'<span class="ok">✓ Pagada</span>'}${del('deudas',d.id)}</div></div>${bar(d.p/d.t*100,'var(--purple)')}</div>`).join(''):'<div class="empty">Sin deudas registradas.</div>'}</div>`},
aho(){return `<div class="card"><div class="label">Total ahorrado</div><div class="big">${$c(sumBy(S.metas,x=>x.a))}</div>${add('+ Nueva meta','addM()')}</div><div class="list">${S.metas.length?S.metas.map(x=>`<div class="entry" style="display:block"><div style="display:flex;justify-content:space-between;gap:8px"><div><div class="entry-title">${esc(x.n)}</div><div class="entry-meta">${$c(x.a)} de ${$c(x.o)} · ${x.a>=x.o?'¡Meta lograda!':'faltan '+$c(x.o-x.a)}${x.f&&x.a<x.o?' · '+mTxt(x):''}</div></div><div class="entry-actions">${bt('+ Abonar',`aboM(${x.id})`,'primary')}${del('metas',x.id)}</div></div>${bar(x.a/x.o*100)}</div>`).join(''):'<div class="empty">Aún no tienes metas.</div>'}</div>`},
cob(){const pe=S.cobros.filter(c=>c.p<c.a),dn=S.cobros.filter(c=>c.p>=c.a),by={};pe.forEach(c=>by[c.w]=(by[c.w]||0)+c.a-c.p);
 return `<div class="card"><div class="label">Te deben en total</div><div class="big">${$c(sumBy(pe,c=>c.a-c.p))}</div><div class="sub">${Object.entries(by).map(([w,v])=>esc(w)+' '+$c(v)).join(' · ')||'Nadie te debe por ahora.'}</div>${add('+ Agregar cobro','addC()')}</div><div class="list">${pe.map(c=>row(c.w+(c.c?' · '+c.c:''),`Debe ${$c(c.a-c.p)} de ${$c(c.a)} · desde ${c.d.slice(8)}/${c.d.slice(5,7)}`,bt('WhatsApp',`waC(${c.id})`)+bt('Abono',`aboC(${c.id})`)+bt('Pagado',`paidC(${c.id})`,'primary')+del('cobros',c.id))).join('')}</div>${dn.length?`<div class="label" style="margin:16px 0 0">Cobrados</div><div class="list">${dn.map(c=>row('✓ '+c.w+(c.c?' · '+c.c:''),$c(c.a),del('cobros',c.id),'dim')).join('')}</div>`:''}`},
com(){return add('+ Nuevo grupo','addGr()')+(S.grupos.length?S.grupos.map(g=>{const s=settle(g);return `<div class="card" style="margin-top:12px"><div style="display:flex;justify-content:space-between;gap:8px"><div><h3>${esc(g.n)}</h3><div class="sub">${g.people.map(esc).join(', ')} · total ${$c(s.t)} · ${$c(s.sh)} c/u</div></div><div class="entry-actions">${bt('+ Gasto',`addGE(${g.id})`,'primary')}${bt('Compartir',`shG(${g.id})`)}${del('grupos',g.id)}</div></div>${s.out.length?'<div class="list">'+s.out.map(o=>`<div class="entry"><b>${esc(o)}</b></div>`).join('')+'</div>':`<div class="sub" style="margin-top:8px">${g.exp.length?'Todos están a mano.':'Aún no hay gastos.'}</div>`}${g.exp.length?'<div class="list">'+g.exp.map(e=>row(e.w,`${$c(e.a)} · pagó ${esc(e.p)}`,bt('×',`rmGE(${g.id},${e.id})`,'danger'),'dim')).join('')+'</div>':''}</div>`}).join(''):'<div class="empty">Crea un grupo para dividir gastos con amigos o en un viaje.</div>')}
};
function render(){$('tabs').innerHTML=TABS.map(([k,n])=>`<button class="btn tab ${k===tab?'active':''}" onclick="go('${k}')">${n}</button>`).join('');$('view').innerHTML=V[tab]()}
applyFijos();render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body></html>
